<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.png') }}" type="image/png">
</head>
<body>
    <div class="container">
        <h1>Login</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <div class="password-container">
                    <input type="password" id="password" name="password" required>
                <div class="password-toggle">
                    <input type="checkbox" id="togglePassword">
                    <label for="togglePassword">Show Password</label>
                    </div>
                </div>
            </div>
            <button type="submit" class="submit-button">Login</button>
            <p class="forgot-link">
                <a href="{{ url_for('forgot_password') }}">Forgot Password / Username?</a>
            </p>
            <p>Don't have an account? <a href="{{ url_for('register_page') }}">Register here</a></p>
        </form>
        <div id="loginMessage"></div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault(); // Prevent default form submission

            const email = document.getElementById('email').value; // Get email from input
            const password = document.getElementById('password').value; // Get password from input
            const messageDiv = document.getElementById('loginMessage');

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json', // <--- Set Content-Type to JSON
                    },
                    body: JSON.stringify({ email, password }) // <--- Send data as JSON string
                });

                const data = await response.json(); // Attempt to parse response as JSON

                if (response.ok) { // Check if status is 2xx (e.g., 200 OK)
                    messageDiv.style.color = 'green';
                    messageDiv.textContent = data.message || 'Login successful!';
                    // Redirect to home page (or desired protected area)
                    window.location.href = '/'; // Redirect to your main home page
                } else {
                    messageDiv.style.color = 'red';
                    // Use the error message from the backend if available, otherwise a generic one
                    messageDiv.textContent = data.error || 'Login failed. Please check credentials.';
                }
            } catch (error) {
                console.error('Error during login fetch:', error);
                messageDiv.style.color = 'red';
                messageDiv.textContent = 'An unexpected error occurred. Please try again.';
            }
        });
        const passwordInput = document.getElementById('password');
        const toggleCheckbox = document.getElementById('togglePassword');
        toggleCheckbox.addEventListener('change', function()
        {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
            } else {
                passwordInput.type = 'password';
            }
        })
    </script>
</body>
</html>
