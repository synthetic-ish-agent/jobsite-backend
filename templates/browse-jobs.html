<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Jobs - Nobleworld</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/browse-jobs.css') }}">
    <link rel="icon" href="/static/images/favicon.png" type="image/png">
</head>
<body>
    <header>
        <div class="logo">
            <a href="/">
                <h1>Nobleworld</h1>
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                {% if session.get('user_id') == 1 %}
    <li class="nav-item">
        <a class="nav-link" href="{{ url_for('post_job_page') }}">Post a Job</a>
    </li>
{% endif %}
                <li><a href="/about-us">About Us</a></li>
                <li><a href="/logout">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main class="job-listings-container">
        <h1>Browse Available Jobs</h1>
        <div id="jobListings"></div>
        <div id="paginationControls" class="pagination-controls"></div>
    </main>

    <footer>
        <p>&copy; 2026 Nobleworld. All rights reserved.</p>
    </footer>

    <script>
        // Safely parse current user ID from Flask session context
        const currentUserId = {{ current_user_id | tojson | safe }}; 

        let allJobs = [];
        let currentPage = 1;
        const jobsPerPage = 4;

        // Helper function to turn raw text strings containing ">" into nice bullet lists with a collapsible wrapper
        function formatTextToList(rawText) {
            if (!rawText) return 'N/A';
            
            let contentHtml = '';
            if (rawText.includes('>')) {
                const items = rawText.split('>').map(i => i.trim()).filter(i => i.length > 0);
                if (items.length > 1) {
                    contentHtml = '<div class="job-text-block"><ul>';
                    items.forEach(item => {
                        contentHtml += `<li>${item}</li>`;
                    });
                    contentHtml += '</ul></div>';
                } else {
                    contentHtml = `<p>${rawText}</p>`;
                }
            } else {
                contentHtml = `<p>${rawText}</p>`;
            }

            // Wrap content in a collapsible container with a Read More toggle button
            return `
                <div class="job-text-collapse">
                    ${contentHtml}
                </div>
                <button type="button" class="read-more-btn" onclick="toggleReadMore(this)">Read More</button>
            `;
        }

        // Function to handle expanding and collapsing long content boxes
        function toggleReadMore(button) {
            const collapseDiv = button.previousElementSibling;
            collapseDiv.classList.toggle('expanded');
            
            if (collapseDiv.classList.contains('expanded')) {
                button.textContent = 'Read Less';
            } else {
                button.textContent = 'Read More';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Use relative path for portability across environments
            fetch('/api/jobs')
            .then(response => {
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return response.json();
            })
            .then(data => {
                allJobs = data;
                const jobListingsContainer = document.getElementById('jobListings');
                
                if (allJobs.length === 0) {
                    jobListingsContainer.innerHTML = '<p class="no-jobs-message">No jobs found.</p>';
                    return;
                }
                renderPage(currentPage);
            })
            .catch(error => {
                document.getElementById('jobListings').innerHTML = `<p class="error-message">Error fetching jobs: ${error.message}.</p>`;
            });
        });

        function renderPage(page) {
            currentPage = page;
            const jobListingsContainer = document.getElementById('jobListings');
            jobListingsContainer.innerHTML = '';

            const startIndex = (page - 1) * jobsPerPage;
            const endIndex = startIndex + jobsPerPage;
            const paginatedJobs = allJobs.slice(startIndex, endIndex);

            paginatedJobs.forEach(job => {
                const jobDiv = document.createElement('div');
                jobDiv.classList.add('job-listing');
                jobDiv.setAttribute('data-job-id', job.id); 
            
                let contactInfoHtml = '';
                if (job.application_email) {
                    contactInfoHtml += `<p class="application-contact"><strong>Apply via Email:</strong> <a href="mailto:${job.application_email}">${job.application_email}</a></p>`;
                }
                if (job.phone_number) {
                    contactInfoHtml += `<p class="application-contact"><strong>Apply via Phone:</strong> <a href="tel:${job.phone_number}">${job.phone_number}</a></p>`;
                }

                let directApplyHtml = `
                    <div class="direct-apply-block">
                        To apply directly, <a href="/apply?id=${job.id}" class="direct-apply-link">click here</a>
                    </div>
                `;

                let actionButtonsHtml = '';
                if (job.poster_id && Number(job.poster_id) === Number(currentUserId)) {
                    actionButtonsHtml = `
                        <div class="job-actions">
                            <button class="edit-job-btn btn-sm btn-info" data-job-id="${job.id}">Edit</button>
                            <button class="delete-job-btn btn-sm btn-danger" data-job-id="${job.id}">Delete</button>
                        </div>`;
                }
                
                jobDiv.innerHTML = `
                    <h3>${job.title}</h3>
                    <p class="company"><strong>Company:</strong> ${job.company} (${job.location})</p>
                    <p class="type"><strong>Type:</strong> ${job.type}</p>
                    ${job.salary ? `<p class="salary"><strong>Salary:</strong> ${job.salary}</p>` : ''}
                    
                    <div style="margin-top: 10px;">
                        <strong>Description:</strong>
                        ${formatTextToList(job.description)}
                    </div>

                    <div style="margin-top: 10px;">
                        <strong>Requirements:</strong>
                        ${formatTextToList(job.requirements)}
                    </div>

                    ${contactInfoHtml}
                    ${directApplyHtml}

                    <div class="job-meta-footer">
                        <span class="posted-date"><strong>Posted on:</strong> ${new Date(job.posted_date).toLocaleDateString()}</span>
                        ${actionButtonsHtml}
                    </div>
                `;

                jobListingsContainer.appendChild(jobDiv);
            });

            renderPaginationControls();
            attachActionListeners();
        }

        function renderPaginationControls() {
            const paginationContainer = document.getElementById('paginationControls');
            const totalPages = Math.ceil(allJobs.length / jobsPerPage);

            if (totalPages <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }

            paginationContainer.innerHTML = `
                <button id="prevPageBtn" ${currentPage === 1 ? 'disabled' : ''}>&larr; Previous</button>
                <span>Page ${currentPage} of ${totalPages}</span>
                <button id="nextPageBtn" ${currentPage === totalPages ? 'disabled' : ''}>Next &rarr;</button>
            `;

            document.getElementById('prevPageBtn').addEventListener('click', () => {
                if (currentPage > 1) {
                    renderPage(currentPage - 1);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });

            document.getElementById('nextPageBtn').addEventListener('click', () => {
                if (currentPage < totalPages) {
                    renderPage(currentPage + 1);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });
        }

        function attachActionListeners() {
            document.querySelectorAll('.delete-job-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const jobId = this.getAttribute('data-job-id');
                    if (confirm('Are you sure you want to delete this job?')) {
                        fetch(`/api/jobs/${jobId}`, { method: 'DELETE' })
                        .then(response => response.json())
                        .then(data => {
                            if (data.message) {
                                alert(data.message);
                                allJobs = allJobs.filter(j => j.id != jobId);
                                const totalPages = Math.ceil(allJobs.length / jobsPerPage) || 1;
                                if (currentPage > totalPages) currentPage = totalPages;
                                renderPage(currentPage);
                            } else {
                                alert(`Error: ${data.error || 'Failed to delete job.'}`);
                            }
                        });
                    }
                });
            });

            document.querySelectorAll('.edit-job-btn').forEach(button => {
                button.button?.addEventListener ? button.addEventListener('click', function() {
                    window.location.href = `/edit-job/${this.getAttribute('data-job-id')}`;
                }) : null;
                button.addEventListener('click', function() {
                    window.location.href = `/edit-job/${this.getAttribute('data-job-id')}`;
                });
            });
        }
    </script>
</body>
</html>
